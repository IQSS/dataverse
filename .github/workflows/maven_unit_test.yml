name: Maven Tests

on:
    push:
        # Only run for development and feature branches. Don't waste CPU cycles testing
        # master when the PR to update it from develop already ran these tests.
        branches:
            - '*'
            - '!master'
        paths: &test-paths
            - "**.java"
            - "**.sql"
            - "pom.xml"
            - "modules/**/pom.xml"
            - "!modules/container-base/**"
            - "!modules/dataverse-spi/**"
            # What the API and JSF tests (dataverse-tests job) depend on. Later entries win, so
            # this includes container-base and dataverse-spi again: the tests run on images built
            # from them.
            - "conf/**"
            - "src/**"
            - "modules/**"
            - "!**/backports/**"
            - "!src/maven/**"
            - "docker-compose-dev.yml"
            - "tests/**"
            - "scripts/**"
            - ".github/workflows/maven_unit_test.yml"
            - ".github/workflows/dataverse_tests.yml"
            - ".github/actions/start-dataverse-stack/**"
            - ".github/actions/run-jsf-tests/**"
            - ".github/actions/collect-docker-logs/**"
    pull_request:
        paths: *test-paths

jobs:
    unittest:
        name: (${{ matrix.status}} / JDK ${{ matrix.jdk }}) Unit Tests
        strategy:
            fail-fast: false
            matrix:
                jdk: [ '21' ]
                experimental: [false]
                status:  ["Stable"]
        continue-on-error: ${{ matrix.experimental }}
        runs-on: ubuntu-latest
        steps:
          # TODO: As part of #10618 change to setup-maven custom action
          # Basic setup chores
          - uses: actions/checkout@v7
          - name: Set up JDK ${{ matrix.jdk }}
            uses: actions/setup-java@v6.0.1
            with:
                java-version: ${{ matrix.jdk }}
                distribution: temurin
                cache: maven

          # The reason why we use "install" here is that we want the submodules to be available in the next step.
          # Also, we can cache them this way for jobs triggered by this one. We need to skip ITs here, as we run
          # them in the next job - but install usually runs through verify phase.
          - name: Build with Maven and run unit tests
            run: > 
                mvn -B -f modules/dataverse-parent
                -Dtarget.java.version=${{ matrix.jdk }}
                -DcompilerArgument=-Xlint:unchecked -P all-unit-tests
                -DskipIntegrationTests
                -pl edu.harvard.iq:dataverse -am
                install

          # We don't want to cache the WAR file, so delete it
          - run: rm -rf ~/.m2/repository/edu/harvard/iq/dataverse

          # Upload the built war file. For download, it will be wrapped in a ZIP by GitHub.
          # See also https://github.com/actions/upload-artifact#zipped-artifact-downloads
          - uses: actions/upload-artifact@v7
            with:
                name: dataverse-java${{ matrix.jdk }}.war
                path: target/dataverse*.war
                retention-days: 7

          # Store the build for the next step (integration test) to avoid recompilation and to transfer coverage reports
          - run: |
                tar -cvf java-builddir.tar target
                tar -cvf java-m2-selection.tar ~/.m2/repository/io/gdcc/dataverse-*
          - uses: actions/upload-artifact@v7
            with:
                name: java-artifacts
                path: |
                    java-builddir.tar
                    java-m2-selection.tar
                retention-days: 3

    integration-test:
        runs-on: ubuntu-latest
        needs: unittest
        name: (${{ matrix.status}} / JDK ${{ matrix.jdk }}) Integration Tests
        strategy:
            fail-fast: false
            matrix:
                jdk: [ '21' ]
                experimental: [ false ]
                status: [ "Stable" ]
                #
                # JDK 17 builds disabled due to non-essential fails marking CI jobs as completely failed within
                # Github Projects, PR lists etc. This was consensus on Slack #dv-tech. See issue #8094
                # (This is a limitation of how Github is currently handling these things.)
                #
                #include:
                #    - jdk: '17'
                #      experimental: true
                #      status: "Experimental"
        continue-on-error: ${{ matrix.experimental }}
        steps:
            # TODO: As part of #10618 change to setup-maven custom action
            # Basic setup chores
            - uses: actions/checkout@v7
            - name: Set up JDK ${{ matrix.jdk }}
              uses: actions/setup-java@v6.0.1
              with:
                  java-version: ${{ matrix.jdk }}
                  distribution: temurin
                  cache: maven

            # Get the build output from the unit test job
            - uses: actions/download-artifact@v8
              with:
                  name: java-artifacts
            - run: |
                tar -xvf java-builddir.tar
                tar -xvf java-m2-selection.tar -C /

            # Run integration tests (but not unit tests again)
            - run: mvn -DskipUnitTests -Dtarget.java.version=${{ matrix.jdk }} verify

            # Wrap up and send to coverage job. The coverage job merges these JaCoCo inputs
            # again, together with the server-side coverage from Dataverse Tests.
            - run: tar -cvf java-reportdir.tar target/site target/coverage-reports/jacoco-*.exec
            - uses: actions/upload-artifact@v7
              with:
                  name: java-reportdir
                  path: java-reportdir.tar
                  retention-days: 3

    # API and JSF tests against the running app, built from the unit-test job's classes so their
    # server-side coverage matches. Runs alongside the integration tests. On pushes, only for develop:
    # Maven Tests also runs on every other branch push, where these suites would be too costly.
    dataverse-tests:
        name: Dataverse Tests
        needs: unittest
        if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' }}
        permissions:
            contents: read
            checks: write
            pull-requests: write
        uses: ./.github/workflows/dataverse_tests.yml
        with:
            use-maven-build: true

    coverage-report:
        runs-on: ubuntu-latest
        needs: [integration-test, dataverse-tests]
        # Also when Dataverse Tests was skipped (branch pushes) or failed: coverage then
        # covers whatever ran.
        if: ${{ !cancelled() && needs.integration-test.result == 'success' }}
        name: Coverage Report Submission
        steps:
            # TODO: As part of #10618 change to setup-maven custom action
            # Basic setup chores
          - uses: actions/checkout@v7
          - uses: actions/setup-java@v6.0.1
            with:
                java-version: '21'
                distribution: temurin
                cache: maven

          # Get the compiled classes (the report needs them), then the integration test job's
          # report and JaCoCo data
          - uses: actions/download-artifact@v8
            with:
              name: java-artifacts
          - uses: actions/download-artifact@v8
            with:
              name: java-reportdir
          - run: |
                tar -xf java-builddir.tar
                tar -xvf java-reportdir.tar

          # Server-side coverage of the API and JSF tests, next to the unit and integration data
          - name: Get Dataverse Tests coverage
            if: ${{ needs.dataverse-tests.result == 'success' || needs.dataverse-tests.result == 'failure' }}
            uses: actions/download-artifact@v8
            with:
              pattern: jacoco-exec-*
              path: target/coverage-reports
              merge-multiple: true

          # Merge every target/coverage-reports/*.exec and rebuild the merged report, with the
          # same executions mvn verify uses (jacoco-merge-unit-and-it, jacoco-report in pom.xml)
          - name: Merge all coverage data
            run: |
                ls -l target/coverage-reports/
                mvn -B jacoco:merge@jacoco-merge-unit-and-it jacoco:report@jacoco-report

          # Hand the merged report to the SonarCloud job
          - run: tar -cvf java-reportdir-merged.tar target/site
          - uses: actions/upload-artifact@v7
            with:
                name: java-reportdir-merged
                path: java-reportdir-merged.tar
                retention-days: 3

          # Deposit Code Coverage
          - name: Deposit Code Coverage
            env:
                CI_NAME: github
                COVERALLS_SECRET: ${{ secrets.GITHUB_TOKEN }}
            # The coverage commit is sometimes flaky. Don't bail out just because this optional step failed.
            continue-on-error: true
            run: >
                mvn -B
                -DrepoToken="${COVERALLS_SECRET}" -DpullRequest=${{ github.event.number }}
                jacoco:report coveralls:report

  # Note: The SONAR_TOKEN secret is required to push analysis results to Sonarcloud.
  # We check for them here and subsequent jobs can rely on this to decide if they shall run.
    check-secrets:
      needs: integration-test
      name: Check for Secrets Availability
      runs-on: ubuntu-latest
      outputs:
        available: ${{ steps.secret-check.outputs.available }}
      steps:
        - id: secret-check
          # perform secret check & put boolean result as an output
          shell: bash
          run: |
            if [ "${{ secrets.SONAR_TOKEN }}" != '' ]; then
                echo "available=true" >> "$GITHUB_OUTPUT";
            else
                echo "available=false" >> "$GITHUB_OUTPUT";
            fi

    sonarcloud:
      runs-on: ubuntu-latest
      needs: [check-secrets, coverage-report]
      name: SonarQube Analysis and Coverage
      # Only run in upstream repo - avoid unnecessary runs in forks (they don't have access to SONAR_TOKEN)
      if: needs.check-secrets.outputs.available == 'true'
      steps:
        # TODO: As part of #10618 change to setup-maven custom action
        # Basic setup chores
        - uses: actions/checkout@v7
          with:
            # Sonarcube benefits from a full Git history in it's analysis (assign issues, etc)
            fetch-depth: 0
        - uses: actions/setup-java@v6.0.1
          with:
            java-version: '21'
            distribution: temurin
            cache: maven

        # Get the merged coverage report from the coverage job (unit, integration, API and JSF tests)
        - uses: actions/download-artifact@v8
          with:
            name: java-reportdir-merged
        # Get the binary class files as Sonar needs them for analysis
        - uses: actions/download-artifact@v8
          with:
            name: java-artifacts
        - run: |
            tar -xvf java-builddir.tar
            tar -xvf java-reportdir-merged.tar

        # Run Sonarcube analysis
        - name: Analyze and commit to SonarCloud
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

    # TODO: Add a filter step here, that avoids calling the app image release workflow if there are changes to the base image.
    #       Use https://github.com/dorny/paths-filter to solve this. Will require and additional job or adding to integration-test job.
    #       This way we ensure that we're not running the app image flow with a non-matching base image.
    #       To become a part of #10618.

    push-app-img:
        name: Publish App Image
        permissions:
            contents: read
            packages: write
            pull-requests: write
        needs: integration-test
        uses: ./.github/workflows/container_app_push.yml
        secrets: inherit
