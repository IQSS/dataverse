name: Dataverse Tests

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - master
    paths-ignore:
      - "doc/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/*.md"
  pull_request:
    branches:
      - develop
      - master
    paths-ignore:
      - "doc/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/*.md"

concurrency:
  group: "dataverse-tests-${{ github.ref }}"
  cancel-in-progress: true

jobs:

  # =====================================================================
  # BUILD: build the containers once and hand them off to the test jobs
  # =====================================================================
  build:
    name: Build Containers
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    permissions:
      contents: read

    steps:

      # ---------------------------
      # CHECKOUT + SETUP JAVA + MAVEN
      # ---------------------------
      # Reads the Java version from the POM and falls back to the shared Maven cache
      # (seeded by maven_cache_management.yml) when this branch has no cache yet.
      - name: Checkout and Setup Maven
        uses: IQSS/dataverse/.github/actions/setup-maven@develop
        with:
          pom-paths: |
            pom.xml
            modules/container-base/pom.xml

      # ---------------------------
      # VERIFY DOCKER
      # ---------------------------
      - name: Verify Docker
        run: |
          set -euo pipefail
          docker version

      - name: Verify Maven
        run: |
          set -euo pipefail
          mvn -version

      # ---------------------------
      # FETCH OR BUILD BASE IMAGE
      # ---------------------------
      - name: Fetch or Build local base image
        run: |
          set -euo pipefail

          # 1. Ask Maven for the expected tag
          BASE_IMAGE=$(cd modules/container-base && mvn build-helper:parse-version help:evaluate -Dexpression=base.image -q -DforceStdout -Pct)
          echo "Target base image: $BASE_IMAGE"

          # 2. Try to pull it. If that fails, build it.
          if docker pull "$BASE_IMAGE"; then
            echo "✅ Image found and pulled successfully! Skipping local build."
          else
            echo "⚠️ Pull failed (image likely doesn't exist yet). Building locally..."
            mvn -Pct clean package -f modules/container-base/pom.xml
          fi

      # ---------------------------
      # BUILD IMAGES (Dataverse-native)
      # ---------------------------
      - name: Build Dataverse containers via Maven
        run: |
          set -euo pipefail
          mvn -Pct -T 1C package

      # ---------------------------
      # PACKAGE BUILD OUTPUT
      # ---------------------------
      # Records which code was built, so a failed run can be reproduced locally from the right commit.
      # On pull requests, GITHUB_SHA is the merge commit of the PR into its base branch, not the PR head.
      - name: Record build info
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p dataverse-build
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "event=${EVENT_NAME}"
            echo "ref=${REF}"
            echo "pr_number=${PR_NUMBER}"
            echo "pr_head_sha=${PR_HEAD_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "app_image_id=$(docker image inspect --format '{{.Id}}' gdcc/dataverse:unstable)"
            echo "configbaker_image_id=$(docker image inspect --format '{{.Id}}' gdcc/configbaker:unstable)"
          } > dataverse-build/build-info.txt
          cat dataverse-build/build-info.txt

      # The base image travels along as layers of the app image, so only these two need saving.
      # docker-compose-dev.yml bind-mounts ./target/dataverse into the app container,
      # so the exploded WAR has to be handed off as well.
      - name: Save images and exploded WAR
        run: |
          set -euo pipefail
          mkdir -p dataverse-build
          docker save gdcc/dataverse:unstable gdcc/configbaker:unstable \
            | zstd -T0 -3 -o dataverse-build/images.tar.zst
          tar -C target -cf - dataverse \
            | zstd -T0 -3 -o dataverse-build/target-dataverse.tar.zst
          ls -lh dataverse-build/

      # Kept for a week so a failed run can be reproduced locally with the exact same images
      # (see "Reproducing a CI Failure Locally" in the developer guide).
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dataverse-build
          path: dataverse-build/
          compression-level: 0
          retention-days: 7

  # =====================================================================
  # API TESTS: the REST Assured suite on its own fresh stack
  # =====================================================================
  api-tests:
    name: Dataverse API Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    permissions:
      contents: read
      checks: write
      pull-requests: write

    env:
      BASE_URL: "http://localhost:8080"

    steps:

      # ---------------------------
      # CHECKOUT + SETUP JAVA + MAVEN
      # ---------------------------
      - name: Checkout and Setup Maven
        uses: IQSS/dataverse/.github/actions/setup-maven@develop

      # ---------------------------
      # START + CONFIGURE DATAVERSE
      # ---------------------------
      # Server-side code coverage: see the "code-coverage" job below.
      - name: Attach JaCoCo agent
        uses: ./.github/actions/attach-jacoco-agent

      - name: Start Dataverse stack
        uses: ./.github/actions/start-dataverse-stack

      # ---------------------------
      # RUN API TESTS
      # ---------------------------
      - name: Run API tests
        env:
          DVAPIKEY: "burrito"
          DV_APIKEY: "burrito"
          DV_API_KEY: "burrito"
        run: |
          set -euo pipefail
          TEST_SUITE=$(cat tests/integration-tests.txt)

          echo "Running suite: $TEST_SUITE"

          mvn test \
            -Dtest="$TEST_SUITE" \
            -Dmaven.test.failure.ignore=true \
            -Ddataverse.test.baseurl="$BASE_URL" \
            -Ddataverse.test.solr.softcommit.millis=100 \
            -DcompilerArgument=-Xlint:unchecked

      # ---------------------------
      # DUMP CODE COVERAGE
      # ---------------------------
      - name: Dump JaCoCo coverage
        if: always()
        run: |
          set -euo pipefail
          mkdir -p coverage
          java -jar jacoco/jacococli.jar dump --address localhost --port 6300 \
            --destfile coverage/api.exec

      - name: Upload JaCoCo coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-exec-api
          path: coverage/api.exec
          retention-days: 14

      # ---------------------------
      # UPLOAD REPORTS + PUBLISH TEST DASHBOARD IN GITHUB PR
      # ---------------------------
      - name: Upload Test Failure Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maven-test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 14

      - name: Publish Test Results Dashboard
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          check_name: API Test Results
          files: |
            target/failsafe-reports/TEST-*.xml
            target/surefire-reports/TEST-*.xml

      # ---------------------------
      # FAIL THE JOB IF TESTS FAILED
      # ---------------------------
      - name: Check for Test Failures
        if: always()
        run: |
          echo "Checking Surefire/Failsafe reports for failures..."
          if grep -q "<failure" target/surefire-reports/*.xml target/failsafe-reports/*.xml 2>/dev/null; then
            echo "API tests failed! Failing the job."
            exit 1
          fi
          echo "All tests passed."

      # ---------------------------
      # COLLECT + UPLOAD DOCKER LOGS (ALWAYS)
      # ---------------------------
      - name: Collect Docker logs
        if: always()
        uses: ./.github/actions/collect-docker-logs
        with:
          artifact-name: docker-logs-api

  # =====================================================================
  # JSF TESTS: one fresh stack per browser. Chromium runs first, then
  # Firefox and WebKit in parallel, so at most three test runners are
  # busy at once and all suites finish at about the same time.
  # =====================================================================
  jsf-chromium:
    name: Dataverse JSF Tests (Chromium)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    permissions:
      contents: read

    env:
      BASE_URL:       "http://localhost:8080"
      LOGIN_ADAPTER:  "builtin"
      DV_USERNAME:    "dataverseAdmin"
      DV_PASSWORD:    "admin1"
      DV_FULL_NAME:   "Dataverse Admin"
      ROOT_DATAVERSE: "/dataverse/root"
      SKIP_PREFLIGHT: "true"
      LOCALLY_FAIR_ENABLED: "false"
      DOTENV_CONFIG_QUIET: "true"

    steps:

      # ---------------------------
      # CHECKOUT + SETUP JAVA + MAVEN
      # ---------------------------
      - name: Checkout and Setup Maven
        uses: IQSS/dataverse/.github/actions/setup-maven@develop

      # ---------------------------
      # START + CONFIGURE DATAVERSE
      # ---------------------------
      - name: Attach JaCoCo agent
        uses: ./.github/actions/attach-jacoco-agent

      - name: Start Dataverse stack
        uses: ./.github/actions/start-dataverse-stack

      # ---------------------------
      # RUN JSF TESTS
      # ---------------------------
      - name: Run JSF tests (chromium)
        uses: ./.github/actions/run-jsf-tests
        with:
          browser: chromium

      # ---------------------------
      # DUMP CODE COVERAGE
      # ---------------------------
      - name: Dump JaCoCo coverage
        if: always()
        run: |
          set -euo pipefail
          mkdir -p coverage
          java -jar jacoco/jacococli.jar dump --address localhost --port 6300 \
            --destfile coverage/chromium.exec

      - name: Upload JaCoCo coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-exec-chromium
          path: coverage/chromium.exec
          retention-days: 14

      # ---------------------------
      # COLLECT + UPLOAD DOCKER LOGS (ALWAYS)
      # ---------------------------
      - name: Collect Docker logs
        if: always()
        uses: ./.github/actions/collect-docker-logs
        with:
          artifact-name: docker-logs-chromium

  jsf-tests:
    name: Dataverse JSF Tests (${{ matrix.label }})
    needs: [build, jsf-chromium]
    # Wait for Chromium, but run whatever its result: one browser's failure
    # shouldn't hide the others.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: firefox
            label: Firefox
          - browser: webkit
            label: WebKit

    defaults:
      run:
        shell: bash

    permissions:
      contents: read

    env:
      BASE_URL:       "http://localhost:8080"
      LOGIN_ADAPTER:  "builtin"
      DV_USERNAME:    "dataverseAdmin"
      DV_PASSWORD:    "admin1"
      DV_FULL_NAME:   "Dataverse Admin"
      ROOT_DATAVERSE: "/dataverse/root"
      SKIP_PREFLIGHT: "true"
      LOCALLY_FAIR_ENABLED: "false"
      DOTENV_CONFIG_QUIET: "true"

    steps:

      # ---------------------------
      # CHECKOUT + SETUP JAVA + MAVEN
      # ---------------------------
      - name: Checkout and Setup Maven
        uses: IQSS/dataverse/.github/actions/setup-maven@develop

      # ---------------------------
      # START + CONFIGURE DATAVERSE
      # ---------------------------
      - name: Attach JaCoCo agent
        uses: ./.github/actions/attach-jacoco-agent

      - name: Start Dataverse stack
        uses: ./.github/actions/start-dataverse-stack

      # ---------------------------
      # RUN JSF TESTS
      # ---------------------------
      - name: Run JSF tests (${{ matrix.browser }})
        uses: ./.github/actions/run-jsf-tests
        with:
          browser: ${{ matrix.browser }}

      # ---------------------------
      # DUMP CODE COVERAGE
      # ---------------------------
      - name: Dump JaCoCo coverage
        if: always()
        run: |
          set -euo pipefail
          mkdir -p coverage
          java -jar jacoco/jacococli.jar dump --address localhost --port 6300 \
            --destfile coverage/${{ matrix.browser }}.exec

      - name: Upload JaCoCo coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-exec-${{ matrix.browser }}
          path: coverage/${{ matrix.browser }}.exec
          retention-days: 14

      # ---------------------------
      # COLLECT + UPLOAD DOCKER LOGS (ALWAYS)
      # ---------------------------
      - name: Collect Docker logs
        if: always()
        uses: ./.github/actions/collect-docker-logs
        with:
          artifact-name: docker-logs-${{ matrix.browser }}

  # =====================================================================
  # CODE COVERAGE: merge the API and JSF jobs' server-side coverage into
  # one report of what the two suites exercise together
  # =====================================================================
  code-coverage:
    name: Code Coverage
    needs: [api-tests, jsf-chromium, jsf-tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    permissions:
      contents: read

    steps:

      - name: Checkout and Setup Maven
        uses: IQSS/dataverse/.github/actions/setup-maven@develop

      # The report needs the exact classes the server ran: the exploded WAR
      # from the build job.
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dataverse-build
          path: ${{ runner.temp }}/dataverse-build

      - name: Restore server classes
        run: |
          set -euo pipefail
          mkdir -p target
          zstd -dc "${{ runner.temp }}/dataverse-build/target-dataverse.tar.zst" | tar -C target -xf -
          ls -d target/dataverse/WEB-INF/classes

      - name: Download JaCoCo coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: jacoco-exec-*
          path: coverage
          merge-multiple: true

      - name: Download JaCoCo
        run: |
          set -euo pipefail
          V=0.8.14
          mkdir -p jacoco
          curl -fsSL -o jacoco/jacococli.jar \
            "https://repo1.maven.org/maven2/org/jacoco/org.jacoco.cli/${V}/org.jacoco.cli-${V}-nodeps.jar"

      - name: Merge coverage and build the report
        run: |
          set -euo pipefail
          ls -l coverage/*.exec
          java -jar jacoco/jacococli.jar merge coverage/*.exec --destfile coverage/jacoco.exec
          report() {
            java -jar jacoco/jacococli.jar report "$1" \
              --classfiles target/dataverse/WEB-INF/classes \
              --sourcefiles src/main/java \
              --name "$2" "${@:3}"
          }
          report coverage/jacoco.exec "Dataverse server coverage - API and JSF tests" \
            --html coverage/jacoco-html --xml coverage/jacoco.xml
          for exec in coverage/api.exec coverage/chromium.exec coverage/firefox.exec coverage/webkit.exec; do
            [ -f "$exec" ] && report "$exec" "$(basename "$exec" .exec)" --xml "${exec%.exec}.xml"
          done

          # Summary table on the run's page
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import os
          import xml.etree.ElementTree as ET

          def totals(path):
              root = ET.parse(path).getroot()
              return {c.get("type"): (int(c.get("covered")), int(c.get("missed"))) for c in root.findall("counter")}

          suites = [("API tests", "api"), ("JSF tests (Chromium)", "chromium"),
                    ("JSF tests (Firefox)", "firefox"), ("JSF tests (WebKit)", "webkit")]
          rows = [("All suites (merged)", "coverage/jacoco.xml")] + [
              (label, f"coverage/{name}.xml") for label, name in suites if os.path.exists(f"coverage/{name}.xml")]
          types = ["LINE", "BRANCH", "METHOD", "CLASS"]
          labels = {"LINE": "Lines", "BRANCH": "Branches", "METHOD": "Methods", "CLASS": "Classes"}
          print("### Server-side code coverage (API + JSF tests)\n")
          print("| | " + " | ".join(labels[t] for t in types) + " |")
          print("|---|" + "---|" * len(types))
          for label, path in rows:
              t = totals(path)
              cells = [f"{100 * t[k][0] / sum(t[k]):.1f}% ({t[k][0]:,}/{sum(t[k]):,})" for k in types]
              print(f"| {label} | " + " | ".join(cells) + " |")
          print("\nFull report: the `jacoco-report-html-xml` artifact of this run (open `jacoco-html/index.html`).")
          PY

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report-html-xml
          path: |
            coverage/jacoco-html/
            coverage/jacoco.xml
            coverage/jacoco.exec
          retention-days: 14
