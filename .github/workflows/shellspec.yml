name: "Shellspec"
on:
    push:
        paths:
            - tests/shell/**
            - .github/workflows/shellspec.yml
            - conf/solr/**
            - scripts/api/setup-datasetfields.sh
            - scripts/api/setup-all.sh
            - scripts/api/setup-builtin-roles.sh
            - scripts/api/setup-identity-providers.sh
            - scripts/api/data/**
            - modules/container-configbaker/scripts/bootstrap.sh
            - modules/container-configbaker/scripts/bootstrap/dev/init.sh
            - modules/container-configbaker/scripts/bootstrap/demo/init.sh
            # add more when more specs are written relying on data
    pull_request:
        paths:
            - tests/shell/**
            - .github/workflows/shellspec.yml
            - conf/solr/**
            - scripts/api/setup-datasetfields.sh
            - scripts/api/setup-all.sh
            - scripts/api/setup-builtin-roles.sh
            - scripts/api/setup-identity-providers.sh
            - scripts/api/data/**
            - modules/container-configbaker/scripts/bootstrap.sh
            - modules/container-configbaker/scripts/bootstrap/dev/init.sh
            - modules/container-configbaker/scripts/bootstrap/demo/init.sh
            # add more when more specs are written relying on data
env:
    SHELLSPEC_VERSION: 0.28.1
jobs:
    shellspec-ubuntu:
        name: "Ubuntu"
        runs-on: ubuntu-latest
        steps:
            - name: Install shellspec
              run: curl -fsSL https://git.io/shellspec | sh -s ${{ env.SHELLSPEC_VERSION }} --yes
            - uses: actions/checkout@v7
            - name: Run Shellspec
              run: |
                  cd tests/shell
                  shellspec
    shellspec-rocky9:
        name: "RockyLinux 9"
        runs-on: ubuntu-latest
        container:
            image: rockylinux/rockylinux:9
        steps:
            - uses: actions/checkout@v7
            - name: Install shellspec
              run: |
                  curl -fsSL https://github.com/shellspec/shellspec/releases/download/${{ env.SHELLSPEC_VERSION }}/shellspec-dist.tar.gz | tar -xz -C /usr/share
                  ln -s /usr/share/shellspec/shellspec /usr/bin/shellspec
            - name: Install dependencies
              run: dnf install -y ed bc diffutils jq
            - name: Run shellspec
              run: |
                  cd tests/shell
                  shellspec
    shellspec-macos:
        name: "MacOS"
        runs-on: macos-latest
        steps:
            - name: Install shellspec
              run: curl -fsSL https://git.io/shellspec | sh -s 0.28.1 --yes
            - uses: actions/checkout@v7
            - name: Run Shellspec
              run: |
                  cd tests/shell
                  /Users/runner/.local/bin/shellspec
