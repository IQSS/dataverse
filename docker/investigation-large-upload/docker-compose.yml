version: "3.8"

# Reproduction environment matching Federico Yemurenko's setup:
# - VM with 8GB RAM, 2 CPUs
# - Payara, PostgreSQL 17, and Solr 9.8.0 running on the same machine
# - Local filesystem storage (no direct S3 upload)

services:
  dataverse:
    container_name: "investigate_dataverse"
    hostname: dataverse
    image: gdcc/dataverse:latest
    restart: on-failure
    user: payara
    environment:
      DATAVERSE_SITEURL: "http://${MACHINE_IP:-localhost}:${DATAVERSE_PORT:-8085}"
      DATAVERSE_DB_HOST: postgres
      DATAVERSE_DB_PASSWORD: secret
      DATAVERSE_DB_USER: dataverse
      DATAVERSE_FEATURE_API_BEARER_AUTH: "1"
      DATAVERSE_MAIL_SYSTEM_EMAIL: "investigate@example.org"
      DATAVERSE_MAIL_MTA_HOST: "smtp"
      JVM_ARGS: >-
        -Ddataverse.files.storage-driver-id=file1
        -Ddataverse.files.file1.type=file
        -Ddataverse.files.file1.label=Filesystem
        -Ddataverse.files.file1.directory=/dv/store
        -Ddataverse.pid.providers=perma1
        -Ddataverse.pid.default-provider=perma1
        -Ddataverse.pid.perma1.type=perma
        -Ddataverse.pid.perma1.label=Perma1
        -Ddataverse.pid.perma1.authority=DV
        -Ddataverse.pid.perma1.permalink.separator=/
    ports:
      - "${DATAVERSE_PORT:-8085}:8080"
      - "${PAYARA_ADMIN_PORT:-4950}:4848"
    networks:
      - dv_network
    depends_on:
      - postgres
      - solr
      - dv_initializer
    volumes:
      - ./data/app/data:/dv
      - ./data/app/secrets:/secrets
    tmpfs:
      - /dumps:mode=1777,size=1024M
      - /tmp:mode=1777,size=1024M
    deploy:
      resources:
        limits:
          cpus: "1.2"
          memory: 4096M
        reservations:
          memory: 2048M

  bootstrap:
    container_name: "investigate_bootstrap"
    image: gdcc/configbaker:latest
    restart: "no"
    environment:
      - TIMEOUT=3m
    command:
      - bootstrap.sh
      - dev
    networks:
      - dv_network
    depends_on:
      - dataverse

  dv_initializer:
    container_name: "investigate_dv_initializer"
    image: gdcc/configbaker:latest
    restart: "no"
    command:
      - sh
      - -c
      - "fix-fs-perms.sh dv"
    volumes:
      - ./data/app/data:/dv

  postgres:
    container_name: "investigate_postgres"
    hostname: postgres
    image: postgres:17
    restart: on-failure
    environment:
      - POSTGRES_USER=dataverse
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=dataverse
    command: >
      postgres
      -c log_statement=all
      -c shared_buffers=512MB
      -c work_mem=16MB
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    networks:
      - dv_network
    volumes:
      - ./data/postgresql/data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: 2048M

  solr_initializer:
    container_name: "investigate_solr_initializer"
    image: gdcc/configbaker:latest
    restart: "no"
    command:
      - sh
      - -c
      - "fix-fs-perms.sh solr && cp -a /template/* /solr-template"
    volumes:
      - ./data/solr/data:/var/solr
      - ./data/solr/conf:/solr-template

  solr:
    container_name: "investigate_solr"
    hostname: solr
    image: solr:9.8.0
    depends_on:
      - solr_initializer
    restart: on-failure
    ports:
      - "${SOLR_PORT:-8985}:8983"
    environment:
      - SOLR_OPTS=-Dsolr.jetty.request.header.size=102400
      - SOLR_JAVA_MEM=-Xms1g -Xmx1536m
    networks:
      - dv_network
    command:
      - "solr-precreate"
      - "collection1"
      - "/template"
    volumes:
      - ./data/solr/data:/var/solr
      - ./data/solr/conf:/template
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: 2048M

networks:
  dv_network:
    driver: bridge
